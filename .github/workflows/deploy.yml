name: Build, Push & Deploy to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: devops-task-app

jobs:
  build-and-push:
    name: Multi-Arch Build & Registry Push
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      semver_tag: ${{ steps.meta.outputs.semver_tag }}
      ghcr_image: ${{ steps.meta.outputs.ghcr_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate semantic version and commit SHA tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          SEMVER="1.0.${{ github.run_number }}"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "semver_tag=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/${OWNER_LOWER}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.semver_tag }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: |
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.semver_tag }}
            ${{ steps.meta.outputs.ghcr_image }}:latest

      - name: Configure AWS credentials via OIDC (if configured)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Log in to Amazon ECR (if configured)
        id: login-ecr
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push multi-arch image to Amazon ECR (if configured)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.semver_tag }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.semver_tag }}

  deploy-ec2:
    name: Deploy to EC2 with Smoke Test & Auto-Rollback
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.AWS_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Deploy container via AWS SSM with smoke test and rollback
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          IMAGE_REPO: ${{ needs.build-and-push.outputs.ghcr_image }}
          NEW_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
          APP_VERSION: ${{ needs.build-and-push.outputs.semver_tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${IMAGE_REPO}:${NEW_TAG}" \
            --parameters 'commands=[
              "set -e",
              "PREV_IMAGE=$(docker inspect --format=\"{{.Config.Image}}\" devops-app 2>/dev/null || echo \"\")",
              "echo \"Previous image: ${PREV_IMAGE}\"",
              "docker pull '"${IMAGE_REPO}:${NEW_TAG}"'",
              "docker stop devops-app 2>/dev/null || true",
              "docker rm devops-app 2>/dev/null || true",
              "docker run -d --name devops-app --restart unless-stopped -p 8080:8080 -e APP_VERSION='"${APP_VERSION}"' '"${IMAGE_REPO}:${NEW_TAG}"'",
              "for i in 1 2 3 4 5 6; do if curl -sf http://127.0.0.1:8080/health; then echo \"Smoke test passed!\"; exit 0; fi; sleep 5; done",
              "echo \"Smoke test failed! Rolling back to ${PREV_IMAGE}...\"",
              "docker stop devops-app 2>/dev/null || true",
              "docker rm devops-app 2>/dev/null || true",
              "if [ -n \"$PREV_IMAGE\" ]; then docker run -d --name devops-app --restart unless-stopped -p 8080:8080 \"$PREV_IMAGE\"; fi",
              "exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"