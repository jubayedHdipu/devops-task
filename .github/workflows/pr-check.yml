name: PR Validation & Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    name: Go Lint, Unit Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: app/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: app

      - name: Run unit tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: app/coverage.out

  lint-docker-and-scripts:
    name: Hadolint & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint shell scripts with ShellCheck
        run: |
          shopt -s globstar nullglob
          scripts=(**/*.sh)
          if [ ${#scripts[@]} -gt 0 ]; then
            shellcheck -x "${scripts[@]}"
          else
            echo "No .sh scripts found yet; skipping."
          fi

  build-and-trivy-scan:
    name: Build Image & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint-and-test, lint-docker-and-scripts]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: devops-task-app:pr-${{ github.event.pull_request.number }}
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
            VCS_REF=${{ github.sha }}

      - name: Run Trivy vulnerability scanner (fail on CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL \
            devops-task-app:pr-${{ github.event.pull_request.number }}
