replicaCount: 2

image:
  repository: ghcr.io/jubayedhdipu/devops-task
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: devops-task.local

env:
  PORT: "8080"
  APP_ENV: "production"
  LOG_LEVEL: "info"

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70