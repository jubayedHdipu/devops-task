replicaCount: 3

image:
  tag: "1.0.0"
  pullPolicy: IfNotPresent

ingress:
  host: devops-task.example.com

env:
  APP_ENV: "production"
  LOG_LEVEL: "info"

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65