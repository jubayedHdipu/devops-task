apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-task-ingress
  namespace: devops-task
  labels:
    app.kubernetes.io/name: devops-task
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: devops-task.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-task-service
                port:
                  number: 80