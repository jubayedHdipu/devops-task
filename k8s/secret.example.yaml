# Do NOT commit real base64-encoded secrets to Git.
# In production, generate via:
#   kubectl create secret generic devops-task-secret -n devops-task \
#     --from-literal=API_AUTH_TOKEN='<strong-random-token>' --dry-run=client -o yaml
# Or manage declaratively with SealedSecrets / External Secrets Operator (AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: devops-task-secret
  namespace: devops-task
  labels:
    app.kubernetes.io/name: devops-task
type: Opaque
stringData:
  API_AUTH_TOKEN: "REPLACE_WITH_EXTERNAL_OR_SEALED_SECRET"