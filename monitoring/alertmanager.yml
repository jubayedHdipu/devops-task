global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h
  receiver: "default-webhook"

receivers:
  - name: "default-webhook"
    webhook_configs:
      - url: "http://127.0.0.1:5001/webhook"
        send_resolved: true